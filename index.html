<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#0D1117" />
    <meta name="description" content="네온 위를 구르며 변을 늘려 가는 도형" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>네모의 꿈</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="overlay">
      <section id="title" class="screen">
        <h1>네모의 꿈</h1>
        <div class="actions">
          <button id="btn-continue" type="button" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5v14l11-7z" />
            </svg>
            <span>이어하기</span>
          </button>
          <button id="btn-new" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
            <span>새로 시작</span>
          </button>
          <button id="btn-settings" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M18 6l-1.6 1.6M7.6 16.4 6 18" />
            </svg>
            <span>설정</span>
          </button>
        </div>
      </section>
      <section id="settings" class="screen" hidden>
        <h2>설정</h2>
        <div class="settings-list">
          <label>BGM <input id="bgm" type="range" min="0" max="100" value="55" /></label>
          <label>효과음 <input id="sfx" type="range" min="0" max="100" value="80" /></label>
          <label>음소거 <input id="mute" type="checkbox" /></label>
          <label>진동 <input id="haptics" type="checkbox" checked /></label>
          <button id="btn-reset" class="danger" type="button">처음부터</button>
          <button id="btn-settings-back" type="button">뒤로</button>
        </div>
      </section>
      <p id="distance" hidden>0m</p>
      <div id="hud" hidden>
        <button id="btn-menu" type="button" aria-label="메뉴" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div id="play-menu" hidden>
          <button id="menu-home" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 10.5 12 4l8 6.5V20h-6v-6H10v6H4z" />
            </svg>
            <span>홈으로 가기</span>
          </button>
          <button id="menu-save" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 4h11l3 3v13H5z" />
              <path d="M8 4v5h7" />
              <path d="M8 20v-6h8v6" />
            </svg>
            <span>수동 저장</span>
          </button>
          <hr />
          <p id="menu-remain">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="2" />
              <path d="M12 6V4M12 20v-2M6 12H4M20 12h-2M7.8 7.8 6.4 6.4M16.2 7.8l1.4-1.4M7.8 16.2 6.4 17.6M16.2 16.2l1.4 1.4" />
            </svg>
            <span>진화까지 4탭</span>
          </p>
          <p id="menu-sides">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3 21 8.5 18 20H6L3 8.5z" />
            </svg>
            <span>4각</span>
          </p>
          <p id="menu-speed">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 15a7 7 0 0 1 14 0" />
              <path d="M12 15 16.5 9" />
            </svg>
            <span>속도 1.00배</span>
          </p>
          <p id="menu-circle">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8" />
            </svg>
            <span>원에 가까움 75%</span>
          </p>
        </div>
      </div>
      <div id="saving" hidden>
        <p>게임 저장중...</p>
      </div>
      <div id="confirm" hidden>
        <p id="confirm-text">진행을 지우고 처음부터 시작할까요?</p>
        <div class="actions">
          <button id="confirm-yes" class="danger" type="button">지우기</button>
          <button id="confirm-no" type="button">취소</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
